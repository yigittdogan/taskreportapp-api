<aside class="sidebar" [ngClass]="{'collapsed': isCollapsed}">
  <div class="sidebar-header">
    <div class="user-avatar">👤</div>
    <div class="user-info" *ngIf="!isCollapsed">
      <span class="user-name">{{ userName }}</span>
      <span class="user-role">Geliştirici</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item" [class.active]="activeTab === 'board'" (click)="tabChange.emit('board')">
      <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/>
        <rect width="7" height="9" x="14" y="10" rx="1"/><rect width="7" height="5" x="3" y="14" rx="1"/>
      </svg>
      <span class="nav-text" *ngIf="!isCollapsed">Görev Listesi</span>
    </a>
    
    <a class="nav-item" [class.active]="activeTab === 'profile'" (click)="tabChange.emit('profile')">
      <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="nav-text" *ngIf="!isCollapsed">Profilim</span>
    </a>

    <a class="nav-item" [class.active]="activeTab === 'stats'" (click)="tabChange.emit('stats')">
      <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/>
      </svg>
      <span class="nav-text" *ngIf="!isCollapsed">İstatistikler</span>
    </a>


<!-- TAKVİM BUTONU (Sistemine %100 Uyumlu Hali) -->
<a class="nav-item" [class.active]="activeTab === 'calendar'" (click)="tabChange.emit('calendar')">
      <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span class="nav-text" *ngIf="!isCollapsed">Takvim</span>
    </a>


<!-- BACKLOG & SPRINT BUTONU (Düzeltilmiş Hali) -->
    <a class="nav-item" [class.active]="activeTab === 'backlog'" (click)="tabChange.emit('backlog')">
      <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <span class="nav-text" *ngIf="!isCollapsed">Backlog & Sprintler</span>
    </a>
  </nav>
  
  <div class="sidebar-footer">
    <button type="button" class="logout-btn" (click)="logout.emit()">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="btn-text" *ngIf="!isCollapsed">Çıkış Yap</span>
    </button>
  </div>
</aside>
